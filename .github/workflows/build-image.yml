name: Build and push processor image

on:
  push:
    branches:
      - fix/custom-tool-body-params
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker-safe branch tag
        id: tag
        run: |
          # Docker tags can't contain '/', replace with '-'
          safe_ref="${GITHUB_REF_NAME//\//-}"
          echo "ref=$safe_ref" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nwoyi/evo-ai-processor-community-1:${{ steps.tag.outputs.ref }}
            ghcr.io/nwoyi/evo-ai-processor-community-1:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
